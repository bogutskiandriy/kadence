name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the package declares; 22 is what most people run.
        node: [20, 22]

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable, so
      # `@v4` silently becomes whatever that tag is moved to. The trailing
      # comment is the human-readable version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: a dependency's postinstall runs with the full
      # permissions of this job, which is the primary npm supply-chain
      # vector. Only esbuild declares one here, and it is not needed: the
      # platform binary arrives through optionalDependencies, so the build
      # and all 548 tests pass without it.
      - run: npm ci --ignore-scripts

      - name: Types
        run: npm run typecheck

      # Build first: the JSON-contract tests spawn dist/cli.js as a real
      # process, which is the only way to prove stdout carries JSON alone.
      # Locally that dependency is hidden by vitest's globalSetup building on
      # demand; in CI the ordering has to be explicit.
      - name: Build
        run: npm run build

      - name: Tests
        # Integration tests create real git repositories, so git needs an
        # identity even though nothing is ever committed.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          npm test

      - name: The fast path must not load the UI layer
        # The whole point of the dynamic import: `kadence task add` never pays
        # for blessed. A regression here is invisible until someone measures.
        #
        # Every built file except the UI chunks. Reading dist/cli.js alone was
        # the bug: the build splits, so a static import from the core lands in
        # a shared chunk that the entry point never mentions.
        run: |
          leaked=0
          for file in $(find dist -name '*.js' ! -name 'board-*' ! -name 'ui-*'); do
            if grep -q "blessed" "$file"; then
              echo "blessed leaked into $file, which every command loads"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] || exit 1
          echo "the fast path is clean"

      - name: The core must not reach the network
        # The product's first constraint, asserted on the artefact people run
        # rather than on the source. The network lives in @kadence/github and
        # nowhere else (ADR-012).
        #
        # `fetch(` heads the list because since Node 18 it is global: a call to
        # it needs no import, so every import-shaped pattern below misses it.
        # And the scan covers the chunks, not just the entry point —
        # node:child_process from src/core/git.ts already lives in one, so an
        # import here was invisible to a grep of dist/cli.js.
        run: |
          found=0
          for forbidden in "fetch(" "node:http" "node:https" "node:http2" "node:net" \
                           "node:tls" "node:dns" "node:dgram" "XMLHttpRequest" \
                           "WebSocket" "node-fetch" "undici" "axios"; do
            for file in $(find dist -name '*.js'); do
              if grep -qF "$forbidden" "$file"; then
                echo "$forbidden reached $file"
                found=1
              fi
            done
          done
          [ "$found" -eq 0 ] || exit 1
          echo "the core makes no network calls"

      # The package ships its own binary, so it needs its own gates. Without
      # this, its entry point had no type coverage at all: nothing imports it,
      # so the root tsconfig never saw it.
      - name: Types (@kadence/github)
        run: npx tsc --noEmit -p packages/github/tsconfig.json

      - name: Build (@kadence/github)
        working-directory: packages/github
        run: node scripts/build.mjs

      - name: Package
        run: npm pack --dry-run
