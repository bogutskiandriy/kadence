name: Release

on:
  push:
    tags: ['v*']
  # Manual runs matter more than they look: a rerun reuses the environment from
  # when the run started, so a secret added afterwards is invisible to it. This
  # is how you retry a release without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run checks out the tag it was given; a tag push already
          # has it.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build; publishing cannot
      # happen on a red suite.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
