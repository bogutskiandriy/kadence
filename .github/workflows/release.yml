name: Release

on:
  push:
    tags: ['v*']
  # Manual runs matter more than they look: a rerun reuses the environment from
  # when the run started, so a secret added afterwards is invisible to it. This
  # is how you retry a release without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Pinned to a commit SHA rather than the mutable `v4` tag; the comment
      # carries the version. See the same note in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A manual run checks out the tag it was given; a tag push already
          # has it.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts only. This
      # package's own prepublishOnly still runs on publish below, which is
      # what keeps a red suite from shipping. See the note in ci.yml.
      - run: npm ci --ignore-scripts

      # prepublishOnly runs typecheck, tests and build; publishing cannot
      # happen on a red suite.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
